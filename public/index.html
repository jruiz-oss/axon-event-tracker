<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Axon Event Tracker</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#14181f;--mute:#667085;--line:#e3e6eb;--accent:#d9480f;--q:#e9ecf1;
--w:#ffe3a3;--h:#ff9248;--hot:#d9480f;--ok:#2b8a3e}
@media (prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#171b23;--ink:#e8ebf0;--mute:#8d96a5;--line:#262c37;--accent:#ff7a3d;--q:#232936;
--w:#6b5a1f;--h:#b8601f;--hot:#e8590c;--ok:#51cf66}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
header{padding:16px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:var(--card)}
h1{font-size:17px;margin:0}.sub{color:var(--mute);font-size:12px}
main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;padding:16px 20px;max-width:1500px;margin:0 auto}
@media(max-width:980px){main{grid-template-columns:1fr;padding:12px 16px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.card h2{font-size:13px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 4px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--ink);padding:5px 12px;cursor:pointer;font-size:12px}
.seg button.on{background:var(--ink);color:var(--card)}
#map{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.tile{aspect-ratio:1;border-radius:6px;background:var(--q);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:600;cursor:pointer;border:2px solid transparent;min-width:0}
.tile small{font-weight:400;font-size:10px;opacity:.85}
.tile.sel{border-color:var(--ink)}
.legend{display:flex;gap:10px;font-size:11px;color:var(--mute);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:11px;color:var(--mute);font-weight:600;padding:4px 6px;border-bottom:1px solid var(--line)}
td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}tr.row{cursor:pointer}tr.row:hover td{background:var(--q)}tr.row.sel td{background:var(--q)}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600}
.b-Hot{background:var(--hot);color:#fff}.b-Warm{background:var(--h);color:#1a1a1a}.b-Watch{background:var(--w);color:var(--ink)}
.up{color:var(--hot)}.down{color:var(--ok)}.mute{color:var(--mute)}
.feed{max-height:420px;overflow:auto}.ev{padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:8px;justify-content:space-between}
.ev a{color:var(--ink);text-decoration:none;font-weight:500}.ev a:hover{text-decoration:underline}
.ev button{border:1px solid var(--line);background:none;color:var(--mute);border-radius:6px;font-size:11px;cursor:pointer;height:24px;white-space:nowrap}
.tag{font-size:11px;color:var(--mute)}
#status{font-size:12px;color:var(--mute)}.bar{height:4px;background:var(--q);border-radius:4px;margin-top:4px;width:180px}.bar i{display:block;height:100%;background:var(--ok);border-radius:4px}
svg text{fill:var(--mute);font-size:10px}
.empty{color:var(--mute);padding:12px 0}
</style>
</head>
<body>
<header>
  <div><h1>Axon TASER: event tracker</h1><div class="sub">US events likely to raise self-defense interest, scored by market. Scores are news-signal vs each market's own baseline.</div></div>
  <div id="status"></div>
</header>
<main>
  <section class="card">
    <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px">
      <div class="seg" id="levelSeg"><button data-l="state" class="on">States</button><button data-l="city">Cities</button></div>
      <a class="sub" href="/api/export.csv">Export event log (CSV)</a>
    </div>
    <div class="chips" id="chips"></div>
    <div id="mapWrap" style="margin-top:10px"><div id="map"></div>
      <div class="legend"><span><i style="background:var(--q)"></i>Quiet</span><span><i style="background:var(--w)"></i>Watch 20+</span><span><i style="background:var(--h)"></i>Warm 40+</span><span><i style="background:var(--hot)"></i>Hot 70+</span></div></div>
    <h2 style="margin-top:16px" id="histTitle">Score history</h2>
    <div id="hist"></div>
  </section>
  <section style="display:grid;gap:16px;align-content:start">
    <div class="card"><h2>Ranked markets</h2><div id="rank"></div></div>
    <div class="card"><h2 id="feedTitle">Event feed</h2><div class="feed" id="feed"></div></div>
  </section>
</main>
<script>
const GRID={AK:[0,0],ME:[10,0],VT:[9,1],NH:[10,1],WA:[0,2],ID:[1,2],MT:[2,2],ND:[3,2],MN:[4,2],IL:[5,2],WI:[6,2],MI:[7,2],NY:[8,2],RI:[9,2],MA:[10,2],
OR:[0,3],NV:[1,3],WY:[2,3],SD:[3,3],IA:[4,3],IN:[5,3],OH:[6,3],PA:[7,3],NJ:[8,3],CT:[9,3],CA:[0,4],UT:[1,4],CO:[2,4],NE:[3,4],MO:[4,4],KY:[5,4],WV:[6,4],VA:[7,4],MD:[8,4],DE:[9,4],
AZ:[1,5],NM:[2,5],KS:[3,5],AR:[4,5],TN:[5,5],NC:[6,5],SC:[7,5],DC:[8,5],OK:[3,6],LA:[4,6],MS:[5,6],AL:[6,6],GA:[7,6],HI:[0,7],TX:[3,7],FL:[8,7]};
const S={level:'state',types:new Set(),sel:null,meta:null,markets:[]};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tq=()=>S.types.size?`&types=${[...S.types].join(',')}`:'';
const lvl=s=>s>=70?'Hot':s>=40?'Warm':s>=20?'Watch':'Quiet';
const colorFor=s=>`var(--${s>=70?'hot':s>=40?'h':s>=20?'w':'q'})`;
const j=async u=>(await fetch(u)).json();

async function init(){
  S.meta=await j('/api/meta');
  $('chips').innerHTML=Object.entries(S.meta.types).map(([k,t])=>`<button class="chip" data-t="${k}" title="Tier ${t.tier}">${esc(t.label)}</button>`).join('');
  $('chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;const t=b.dataset.t;S.types.has(t)?S.types.delete(t):S.types.add(t);b.classList.toggle('on');refresh()};
  $('levelSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.level=b.dataset.l;S.sel=null;[...$('levelSeg').children].forEach(x=>x.classList.toggle('on',x===b));$('mapWrap').style.display=S.level==='state'?'':'none';refresh()};
  renderStatus(S.meta.status);
  refresh();
  setInterval(refresh,5*60e3);
}
function renderStatus(st){
  const live=st.lastLive?`Last pull ${new Date(st.lastLive).toLocaleString()}`:'Waiting for first pull';
  const bf=st.pct<100?`History backfill ${st.pct}%${st.running?' (running)':''}<div class="bar"><i style="width:${st.pct}%"></i></div>`:'History backfill complete (90 days)';
  $('status').innerHTML=`${esc(live)}<br>${bf}`;
}
async function refresh(){
  S.markets=await j(`/api/markets?level=${S.level}${tq()}`);
  renderMap();renderRank();
  if(!S.sel&&S.markets.length)S.sel=S.markets[0].key;
  renderSel();
}
function renderMap(){
  const m=Object.fromEntries(S.markets.map(x=>[x.key,x]));
  $('map').innerHTML=Object.entries(GRID).map(([st,[c,r]])=>{const x=m[st];const s=x?x.score:0;
    return `<div class="tile ${S.sel===st?'sel':''}" data-k="${st}" style="grid-column:${c+1};grid-row:${r+1};background:${colorFor(s)};${s>=70?'color:#fff':''}" title="${esc(S.meta.states[st])}${x?': '+s:''}">${st}${x?`<small>${s}</small>`:''}</div>`}).join('');
  $('map').onclick=e=>{const t=e.target.closest('.tile');if(!t)return;S.sel=t.dataset.k;renderMap();renderRank();renderSel()};
}
function renderRank(){
  if(!S.markets.length){$('rank').innerHTML='<div class="empty">No scored markets yet. First pull runs shortly after deploy; history fills in over the first hour or so.</div>';return}
  $('rank').innerHTML=`<table><thead><tr><th>Market</th><th>Score</th><th>7d</th><th>Drivers</th><th>Recommendation</th></tr></thead><tbody>`+S.markets.slice(0,15).map(x=>{
    const d=x.delta;return `<tr class="row ${S.sel===x.key?'sel':''}" data-k="${esc(x.key)}"><td><b>${esc(x.key)}</b></td><td><span class="badge b-${x.level}">${x.score}</span></td>
    <td class="${d>0?'up':d<0?'down':'mute'}">${d>0?'+':''}${d}</td><td class="tag">${x.topTypes.map(t=>esc(S.meta.types[t]?.label||t)).join(', ')}</td><td class="tag">${esc(x.action)}</td></tr>`}).join('')+`</tbody></table>`;
  $('rank').onclick=e=>{const t=e.target.closest('tr.row');if(!t)return;S.sel=t.dataset.k;renderMap();renderRank();renderSel()};
}
async function renderSel(){
  if(!S.sel){$('feed').innerHTML='<div class="empty">Pick a market.</div>';$('hist').innerHTML='';return}
  $('feedTitle').textContent=`Event feed: ${S.sel}`;$('histTitle').textContent=`Score history (90 days): ${S.sel}`;
  const [ev,h]=await Promise.all([j(`/api/events?market=${encodeURIComponent(S.sel)}&days=14${tq()}`),j(`/api/history?market=${encodeURIComponent(S.sel)}&level=${S.level}&days=90${tq()}`)]);
  $('feed').innerHTML=ev.length?ev.map(e=>`<div class="ev"><div><a href="${esc(e.url)}" target="_blank" rel="noopener noreferrer">${esc(e.title)}</a><div class="tag">${esc(e.domain||'')} · ${esc(S.meta.types[e.type]?.label||e.type)} · ${new Date(e.seen_at).toLocaleDateString()}</div></div><button data-id="${e.id}" title="Not relevant, remove it from scoring">Dismiss</button></div>`).join(''):'<div class="empty">No events in the last 14 days.</div>';
  $('feed').onclick=async e=>{const b=e.target.closest('button[data-id]');if(!b)return;await fetch(`/api/events/${b.dataset.id}/dismiss`,{method:'POST'});refresh()};
  renderHist(h);
}
function renderHist(h){
  const W=640,H=150,p={l:28,r:8,t:8,b:20};const max=Math.max(100,...h.map(x=>x.score));
  const x=i=>p.l+i*(W-p.l-p.r)/(h.length-1),y=v=>p.t+(H-p.t-p.b)*(1-v/max);
  const pts=h.map((d,i)=>`${x(i).toFixed(1)},${y(d.score).toFixed(1)}`).join(' ');
  const ticks=[0,25,50,75,100].map(v=>`<line x1="${p.l}" x2="${W-p.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="2" y="${y(v)+3}">${v}</text>`).join('');
  const lab=[0,Math.floor(h.length/2),h.length-1].map(i=>`<text x="${x(i)}" y="${H-4}" text-anchor="${i===0?'start':i===h.length-1?'end':'middle'}">${h[i].d.slice(5)}</text>`).join('');
  $('hist').innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Score history">${ticks}<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2"/>${lab}</svg>`;
}
init();
</script>
</body>
</html>
